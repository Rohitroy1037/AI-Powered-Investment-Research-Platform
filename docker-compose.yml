services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')", '--quiet']
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./apps/api
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - api
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
volumes:
  mongo-data:
